[project]
name = "ai-experiments"
version = "0.1.0"
description = "Injecting new knowledge and terminology into small LLMs and embedding models, and extracting it again"
requires-python = "==3.12.*"
dependencies = [
    "datasets>=4.3.0",
    "numpy>=2.5.3",
    "sentence-transformers>=6.0.1",
    "torch>=2.11.0",
    "unsloth>=2026.9.4",
]

[project.optional-dependencies]
tracking = []

[tool.uv]
# Bundle CUDA 12.8 runtime with torch; driver 591.86 supports up to CUDA 13.1.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "dvc>=3.67.1",
]
